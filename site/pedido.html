<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pedido - Lojas CEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="conta">
  <header id="site-header"></header>

  <main class="page container" id="conteudo" style="max-width:1200px"></main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const main = document.getElementById('conteudo');
    const id = param('id');
    const nomesPag = { pix: 'Pix', cartao: 'Cartão de crédito', carne: 'Carnê digital' };
    const fresh = document.referrer.includes('checkout.html');

    // QR Code ilustrativo: padrão determinístico, não é um Pix real.
    function fakeQr(seed) {
      const n = 25;
      let h = hash(seed);
      const cells = [];
      const finder = (x, y) => [[0, 0], [n - 7, 0], [0, n - 7]].some(([fx, fy]) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if (finder(x, y)) continue;
        h = (Math.imul(h, 1103515245) + 12345) >>> 0;
        if ((h >>> 16) & 1) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
      }
      const box = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="#000"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
      return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" class="qr" role="img" aria-label="QR Code ilustrativo"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><g fill="#000">${cells.join('')}${box(0.5, 0.5)}${box(n - 6.5, 0.5)}${box(0.5, n - 6.5)}</g></svg>`;
    }

    function render() {
      const o = Orders.get(id);
      if (!o) {
        main.innerHTML = `<div class="card empty-state">${icon('box')}<h1 style="font-size:2rem">Pedido não encontrado</h1><p>Confira seus pedidos em Minha conta.</p><a class="btn btn-primary" href="minha-conta.html#pedidos">Meus pedidos</a></div>`;
        return;
      }
      const stepIdx = Orders.step(o);
      const steps = ORDER_STEPS[o.entrega.modo];
      const loja = o.entrega.modo === 'loja' ? STORES.find((s) => s.id === o.entrega.loja) : null;
      const expira = new Date(new Date(o.pixGeradoEm || o.data).getTime() + 30 * 60000);
      const expirado = Date.now() >= expira;
      const podeRetirar = o.entrega.modo === 'loja' && stepIdx === 3;
      const pixCode = `00020126580014BR.GOV.BCB.PIX-ILUSTRATIVO-${o.id}-${o.totais.total.toFixed(2)}`;

      main.innerHTML = `
        <nav class="breadcrumb" aria-label="Trilha"><a href="index.html">Início</a> &nbsp;/&nbsp; <a href="minha-conta.html#pedidos">Meus pedidos</a> &nbsp;/&nbsp; <span aria-current="page">${o.id}</span></nav>
        ${fresh ? `<div class="order-hero">${icon('checkCircle')}<div><h1>Pedido realizado!</h1><p>Obrigado, ${escapeHtml(o.cliente.nome.split(' ')[0])}. Enviamos a confirmação para ${escapeHtml(o.cliente.email)} (simulado).</p></div></div>`
          : `<h1 style="margin-bottom:16px">Pedido ${o.id}</h1>`}

        <section class="card order-card">
          <div class="order-head">
            <div><span class="muted">Número do pedido</span><strong>${o.id}</strong></div>
            <div><span class="muted">Data</span><strong>${new Date(o.data).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</strong></div>
            <div><span class="muted">Total</span><strong>${brl(o.totais.total)}</strong></div>
            <div><span class="muted">Status</span><strong class="status-txt">${Orders.status(o)}</strong></div>
          </div>
          ${o.cancelado ? `
          <div class="notice warn" style="margin-top:16px">${icon('info')}<div><strong>Pedido cancelado em ${new Date(o.canceladoEm).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}.</strong>
            ${o.pago ? 'O valor pago seria estornado na mesma forma de pagamento (simulado).' : 'Nenhuma cobrança foi realizada.'}</div></div>` : `
          <ol class="timeline" aria-label="Andamento do pedido">
            ${steps.map((s, i) => `<li class="${i < stepIdx ? 'done' : i === stepIdx ? 'current done' : ''}"><span class="dot">${i <= stepIdx ? icon('check') : ''}</span>${s}</li>`).join('')}
          </ol>
          <p class="hint" style="text-align:center">Simulação: o status avança a cada 2 minutos após a aprovação do pagamento.</p>`}
          <div class="order-actions">
            ${podeRetirar ? `<button type="button" class="btn btn-primary" id="retirar">${icon('store')} Confirmar retirada na loja (simulado)</button>` : ''}
            ${Orders.podeCancelar(o) ? `<button type="button" class="btn btn-outline" id="cancelar">${icon('x')} Cancelar pedido</button>` : ''}
          </div>
        </section>

        ${o.pagamento.tipo === 'pix' && !o.pago && !o.cancelado ? `
        <section class="card pix-box${expirado ? ' expired' : ''}">
          ${fakeQr(o.id + (o.pixGeradoEm || ''))}
          <div>
            ${expirado ? `
            <h2>Código Pix expirado</h2>
            <p>O prazo de 30 minutos terminou. Gere um novo código para pagar.</p>
            <button type="button" class="btn btn-primary btn-lg" id="regen">${icon('refresh')} Gerar novo código Pix</button>` : `
            <h2>Pague com Pix para confirmar</h2>
            <p>Escaneie o QR Code ou copie o código abaixo. Expira em <strong id="timer"></strong>.</p>
            <div class="coupon"><input class="input" id="pix-code" readonly value="${pixCode}" aria-label="Código Pix copia e cola"><button type="button" class="btn btn-blue" id="copy">${icon('copy')} Copiar</button></div>
            <button type="button" class="btn btn-primary btn-lg" id="pay">Simular pagamento do Pix</button>`}
            <p class="hint">QR Code e código ilustrativos: não correspondem a uma cobrança real.</p>
          </div>
        </section>` : ''}

        <dialog id="confirm-cancel" aria-labelledby="cc-title">
          ${icon('info')}
          <h2 id="cc-title">Cancelar o pedido ${o.id}?</h2>
          <p>Os produtos voltam para o estoque${o.pago ? ' e o valor pago seria estornado (simulado)' : ''}. Esta ação não pode ser desfeita.</p>
          <button type="button" class="btn btn-primary btn-block" id="cc-yes">Sim, cancelar pedido</button>
          <button type="button" class="btn btn-outline btn-block" style="margin-top:10px" id="cc-no">Voltar</button>
        </dialog>

        <div class="order-grid">
          <section class="card order-card">
            <h2>Itens</h2>
            ${o.itens.map((i) => {
              const p = productById(i.id);
              return `<div class="mc-item">${productImg(p, 1, '')}<div><strong>${i.nome}</strong><span class="muted">${[i.cor, i.volt].filter(Boolean).join(' • ')} • ${i.qty} un.</span><span class="mc-price">${brl(i.preco * i.qty)}</span></div></div>`;
            }).join('')}
          </section>
          <div>
            <section class="card order-card">
              <h2>${o.entrega.modo === 'casa' ? 'Entrega' : 'Retirada'}</h2>
              ${o.entrega.modo === 'casa'
                ? `<p><strong>${escapeHtml(addrLine(o.entrega.endereco))}</strong><br>${escapeHtml(addrCity(o.entrega.endereco))}<br><span class="muted">Prazo: ${o.entrega.prazo}</span></p>`
                : `<p><strong>${loja.nome}</strong><br>${loja.end} • ${loja.cidade} / ${loja.uf}<br><span class="muted">Disponível em até 2 dias úteis após a aprovação.</span></p>`}
            </section>
            <section class="card order-card">
              <h2>Pagamento</h2>
              <p><strong>${nomesPag[o.pagamento.tipo]}</strong>${o.pagamento.tipo === 'cartao' ? ` ${o.pagamento.bandeira ?? ''} final ${o.pagamento.final}` : ''}
                ${o.pagamento.parcelas > 1 ? ` • ${o.pagamento.parcelas}x de ${brl(o.totais.total / o.pagamento.parcelas)}` : ''}</p>
              ${o.pagamento.tipo === 'carne' ? '<a class="link-btn" href="minha-conta.html#carne">Ver parcelas no carnê digital ' + icon('chevronRight') + '</a>' : ''}
              <div class="sum-line" style="margin-top:12px"><span>Produtos</span><span>${brl(o.totais.sub)}</span></div>
              ${o.totais.desconto ? `<div class="sum-line discount"><span>Cupom ${o.totais.cupom}</span><span>- ${brl(o.totais.desconto)}</span></div>` : ''}
              ${o.totais.pix ? `<div class="sum-line discount"><span>Desconto Pix</span><span>- ${brl(o.totais.pix)}</span></div>` : ''}
              <div class="sum-line"><span>Entrega</span><span>${o.totais.frete ? brl(o.totais.frete) : 'Grátis'}</span></div>
              <div class="sum-line" style="font-weight:800;font-size:1.4rem"><span>Total</span><span>${brl(o.totais.total)}</span></div>
            </section>
          </div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px">
          <a class="btn btn-primary" href="minha-conta.html#pedidos">Ver meus pedidos</a>
          <a class="btn btn-outline" href="index.html">Continuar comprando</a>
        </div>`;

      document.getElementById('pay')?.addEventListener('click', () => {
        Orders.save({ ...o, pago: true, pagoEm: new Date().toISOString() });
        toast('Pagamento Pix aprovado (simulado)!');
        render();
      });
      document.getElementById('copy')?.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(pixCode); } catch { document.getElementById('pix-code').select(); }
        toast('Código Pix copiado');
      });
      document.getElementById('regen')?.addEventListener('click', () => {
        Orders.save({ ...o, pixGeradoEm: new Date().toISOString() });
        toast('Novo código Pix gerado');
        render();
      });
      document.getElementById('retirar')?.addEventListener('click', () => {
        Orders.save({ ...o, retiradoEm: new Date().toISOString() });
        toast('Retirada confirmada!');
        render();
      });
      const dlg = document.getElementById('confirm-cancel');
      document.getElementById('cancelar')?.addEventListener('click', () => dlg.showModal());
      document.getElementById('cc-no').addEventListener('click', () => dlg.close());
      document.getElementById('cc-yes').addEventListener('click', () => {
        dlg.close();
        Orders.cancel(o);
        toast('Pedido cancelado');
        render();
      });

      clearInterval(window._t);
      const timer = document.getElementById('timer');
      if (timer) {
        const tick = () => {
          const s = Math.max(0, Math.round((expira - Date.now()) / 1000));
          if (!s) { clearInterval(window._t); render(); return; }
          timer.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        };
        tick();
        window._t = setInterval(tick, 1000);
      }
    }
    render();
  </script>
</body>
</html>
