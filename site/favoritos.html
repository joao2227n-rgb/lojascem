<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Favoritos - Lojas CEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="favoritos">
  <header id="site-header"></header>

  <main class="page container" id="conteudo">
    <nav class="breadcrumb" aria-label="Trilha"><a href="index.html">Início</a> &nbsp;/&nbsp; <span aria-current="page">Favoritos</span></nav>
    <h1>Meus favoritos</h1>
    <p class="subtitle" id="count"></p>
    <div class="cat-grid fav-grid" id="grid"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function render() {
      const list = Favs.ids().map(productById).filter(Boolean);
      document.getElementById('count').textContent = plural(list.length, 'produto salvo', 'produtos salvos');
      document.getElementById('grid').innerHTML = list.length
        ? list.map(productCard).join('')
        : `<div class="card empty-state" style="grid-column:1/-1">${icon('heart')}<h2>Nenhum favorito ainda</h2><p>Toque no coração dos produtos para salvá-los aqui.</p><a class="btn btn-primary" href="categoria.html">Explorar produtos</a></div>`;
    }
    document.addEventListener('favs-changed', render);
    render();
  </script>
</body>
</html>
